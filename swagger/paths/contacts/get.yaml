tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Get a list of all contacts for the authenticated user
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number for pagination
    required: false
    schema:
      type: integer
      minimum: 1
      default: 1
      example: 1
  - name: perPage
    in: query
    description: Number of items per page
    required: false
    schema:
      type: integer
      minimum: 1
      default: 10
      example: 10
  - name: sortBy
    in: query
    description: Field name to sort by
    required: false
    schema:
      type: string
      default: _id
      example: name
  - name: sortOrder
    in: query
    description: Sort order
    required: false
    schema:
      type: string
      enum: [asc, desc]
      default: asc
      example: asc
  - name: filters
    in: query
    description: JSON string with filters
    required: false
    schema:
      type: string
      example: '{"isFavourite": true}'
responses:
  '200':
    description: Successfully retrieved contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully retrieved contacts list!
            data:
              type: object
              properties:
                contacts:
                  type: array
                  items:
                    $ref: ../../components/schemas/contacts.yaml
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 35
                totalPages:
                  type: integer
                  example: 4
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    $ref: ../../components/responses/401.yaml
  '404':
    description: Contacts not found

tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Get a list of all contacts for the authenticated user
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number for pagination
    required: false
    schema:
      type: integer
      minimum: 1
      default: 1
      description: Page number for pagination
  - name: perPage
    in: query
    description: Number of items per page
    schema:
      type: integer
      minimum: 1
      default: 10
      description: Number of contacts per page
  - name: sortBy
    in: query
    schema:
      type: string
      default: '_id'
    description: Field name to sort by
  - name: sortOrder
    in: query
    schema:
      type: string
      enum:
        - asc
        - desc
      default: asc
    description: Sort order
responses:
  '200':
    description: Successfully retrieved contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully retrieved contacts list!
            data:
              type: object
              properties:
                contacts:
                  type: array
                  items:
                    $ref: ../../components/schemas/contacts.yaml
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 50
                totalPages:
                  type: integer
                  example: 5
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    $ref: ../../components/responses/401.yaml
